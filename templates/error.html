<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>هەڵە</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            background: #0a0e17;
            color: #c9d1d9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .box {
            background: rgba(22, 27, 34, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(248, 81, 73, 0.3);
            border-radius: 24px;
            padding: 50px 40px;
            max-width: 500px;
        }
        .icon { font-size: 4em; margin-bottom: 20px; }
        h2 { color: #f85149; margin-bottom: 15px; }
        p { color: #8b949e; line-height: 1.8; }
        a {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 30px;
            background: linear-gradient(135deg, #58a6ff, #1f6feb);
            color: #fff;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="icon">⚠️</div>
        <h2>{{ message }}</h2>
        <p>{{ detail or 'تکایە دڵنیابەرەوە کە زانیارییەکانت دروستن.' }}</p>
        <a href="/">گەڕانەوە بۆ سەرەتا</a>
    </div>
</body>
</html>
