<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>چوونەژوورەوە | پانێڵی پارتنەرەکان</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            background: #0a0e17;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            width: 100%; height: 100%;
            background-image:
                radial-gradient(2px 2px at 20px 30px, #58a6ff, transparent),
                radial-gradient(2px 2px at 40px 70px, #fff, transparent),
                radial-gradient(1px 1px at 90px 40px, #58a6ff, transparent),
                radial-gradient(1px 1px at 130px 80px, #fff, transparent),
                radial-gradient(2px 2px at 160px 30px, #58a6ff, transparent);
            background-repeat: repeat;
            background-size: 200px 100px;
            animation: twinkle 4s ease-in-out infinite;
            opacity: 0.3;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }

        .login-box {
            position: relative;
            z-index: 10;
            background: rgba(22, 27, 34, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(88, 166, 255, 0.3);
            border-radius: 24px;
            padding: 50px 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6), 0 0 80px rgba(88, 166, 255, 0.1);
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo { text-align: center; margin-bottom: 30px; }

        .logo-icon {
            font-size: 4em;
            display: block;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 20px rgba(88, 166, 255, 0.5));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 { color: #fff; font-size: 1.6em; font-weight: 700; text-align: center; margin-bottom: 8px; }
        .subtitle { color: #8b949e; text-align: center; font-size: 0.9em; margin-bottom: 30px; }

        .form-group { margin-bottom: 20px; }
        label { display: block; color: #8b949e; font-size: 0.85em; margin-bottom: 8px; font-weight: 500; }

        input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(13, 17, 23, 0.8);
            border: 1px solid #30363d;
            border-radius: 12px;
            color: #fff;
            font-size: 1em;
            font-family: 'Vazirmatn', sans-serif;
            transition: all 0.3s;
            outline: none;
        }

        input:focus { border-color: #58a6ff; box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15); }
        input::placeholder { color: #484f58; }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #58a6ff 0%, #1f6feb 100%);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 1.05em;
            font-weight: 700;
            font-family: 'Vazirmatn', sans-serif;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
            box-shadow: 0 8px 20px rgba(88, 166, 255, 0.3);
        }

        button:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(88, 166, 255, 0.5); }

        .error {
            background: rgba(248, 81, 73, 0.1);
            border: 1px solid rgba(248, 81, 73, 0.3);
            color: #f85149;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-size: 0.9em;
            margin-bottom: 20px;
            animation: shake 0.4s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        .footer-text { text-align: center; color: #484f58; font-size: 0.75em; margin-top: 30px; }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo">
            <span class="logo-icon">🚀</span>
            <h1>پانێڵی پارتنەرەکان</h1>
            <p class="subtitle">تکایە ID ی خۆت بنووسە بۆ بینینی ئامارەکانت</p>
        </div>

        {% if error %}
        <div class="error">⚠️ {{ error }}</div>
        {% endif %}

        <form method="POST" action="/login">
            <div class="form-group">
                <label>🆔 ID ی دیسکۆرد</label>
                <input type="text" name="user_id" placeholder="بۆ نموونە: 725407103916703755" required autofocus>
            </div>
            <button type="submit">چوونەژوورەوە ←</button>
        </form>

        <p class="footer-text">دروستکراوە لە لایەن STORMBOY و MRX • NINE</p>
    </div>
</body>
</html>
